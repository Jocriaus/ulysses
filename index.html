<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ulysses docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="How Ulysses was built in Godot: a manual for backend developers and gamers">
  <link rel="stylesheet" href="lib/vue.css">
  <style>
    :root {
      --theme-color: #c8650f;   /* the flood's orange, darkened to read on white */
    }
    .markdown-section { max-width: 920px; }
    .markdown-section img {
      max-width: 100%;
      border: 1px solid #e3e3e3;
      border-radius: 4px;
    }
    /* small pixel-art screenshots stay sharp when scaled */
    .markdown-section img[src*="images/"]:not([src*="editor-"]) { image-rendering: pixelated; }
    .markdown-section table { display: table; width: 100%; }
    .sidebar .app-name-link { font-weight: 700; }
  </style>
</head>
<body>
  <div id="app">Loading the docs...</div>
  <script>
    window.$docsify = {
      name: 'Ulysses docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      homepage: 'README.md',
      search: {
        placeholder: 'Search the manual',
        noData: 'Nothing found',
        depth: 3,
        paths: 'auto'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    };
  </script>
  <script src="lib/docsify.min.js"></script>
  <script src="lib/plugins/search.min.js"></script>
  <script src="lib/plugins/zoom-image.min.js"></script>
  <script src="lib/plugins/docsify-copy-code.min.js"></script>
  <script src="lib/plugins/docsify-pagination.min.js"></script>
  <script src="lib/prism/prism-clike.min.js"></script>
  <script src="lib/prism/prism-c.min.js"></script>
  <script src="lib/prism/prism-glsl.min.js"></script>
  <script src="lib/prism/prism-gdscript.min.js"></script>
  <script src="lib/prism/prism-ini.min.js"></script>
  <script src="lib/prism/prism-bash.min.js"></script>
  <script src="lib/prism/prism-powershell.min.js"></script>
  <script src="lib/prism/prism-python.min.js"></script>
  <script src="lib/prism/prism-lua.min.js"></script>
</body>
</html>
